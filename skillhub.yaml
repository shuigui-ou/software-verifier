# SkillHub 发布清单（manifest）
# 字段对齐 skillhub.cn 上架规范；与 SKILL.md frontmatter 保持一致。
skill:
  name: software-verifier
  displayName: 软件功能全量验证器
  version: 1.10.0
  author: user_12807b25
  category: 开发工具
  tags:
    - 软件测试
    - 功能走查
    - 回归验证（按 spec 回归断言可用；T7 翻译器已就绪，Layer3 run-mode 待接）
    - 自动化
    - 无头浏览器
    - 自进化
    - 自愈
    - 视觉回归
  - MCP验收
  - 防偷懒
  - AI监督
  - 追问对账
  description: 像真人一样按说明书把软件功能全量验证一遍。解析说明书→用本机无头 Edge/Electron/小程序/Appium 真实点击填表→截图抓错断言→产出 ✅/❌ 报告。只验证不修复，带自进化知识库与贡献回流；v1.1 新增【自愈 Healer】（选择器失效自动找回等价元素）、【零依赖视觉回归】（DOM 布局指纹区分真缺陷与设计变更）、【MCP server】（别的 agent 也能直接调用验证能力）；v1.2 新增【verify_mcp · 验收其他 MCP】（作为 MCP client 连接目标 server，按 spec 核对工具清单并校验返回，补齐行为级契约验收）；v1.2.2 坑回流抽坑即脱敏+一键回传（--share）、预置 21 条公共 UI 验证坑语料，冷启动即有货；v1.2.3 坑匹配泛化（核心关键词+大小写不敏感+同义归一），同类报错不同措辞也命中；v1.2.4 坑库去重整理（64 条回流噪坑归并为 9 条干净可复用坑并补真实解法）；v1.2.5 抓坑即推断默认解法（新坑出生即带可用提示）；v1.2.6 坑库自维护（按 SYN_KEYS 信号词签名自动归并，库自洁净）；v1.3.0 行为闭环（学到 → 动作前拦截，不再是"只写不读"）——新增【复发哨兵】（同一指纹被反复 land 仍复发 → 判定候选无效并回写否决，loop 不再空转自欺）、【遮挡自愈】（点击/等待被 loading/模态遮罩拦截时三档自愈：清遮罩重试 → 原生 DOM click 兜底）、【网络与端口预检自愈】（导航前等待目标可达、端口被占自动改用空闲端口；证据驱动，只由本机学到的复发记忆触发，坑库仅作提示）、【跨宿主指纹归一】（剥离调用栈帧，同源错误在不同宿主收敛到同一指纹，共享知识库真正可跨宿主命中）。v1.4.0 去守门员化（G/P/I 双线贯通 + 读侧闭环）：agent-evolution 不再只当 E 类错误的守门员——新增期望落差(G)/计划偏离(P)/悬挂未完结(I) 三类信号接入进化账本并落盘，外部解法经 advisory 读回 verify.cjs 报告「进化提示」段，资料→经验→行为真正闭合成环，解除只写不读。v1.5.0 新增【防偷懒监督器】（已接线）：追问-对账-门禁三阶段闭环，verify.cjs 主流程自动驱动，跑完后对账并把结论挂到 result.supervisor；verdict 只看覆盖、不看功能点 assert 是否通过；插件缺失时宿主行为逐字节不变。v1 只做 feature 级对账，且暂无关闭监督的 CLI 开关。。当前以诚实标签「防偷懒」等披露；接线并验收通过后改为正式标签。 v1.9.0 新增交互式追问（--question 手动模式）：按 6 类测试点（输入边界/状态转换/并发竞态/异常恢复/性能超时/安全注入）逐轮向操作者提问，人工补充的测试点成为真实契约纳入对账（无执行日志即 dangling→REJECT，与自动模式同一红线）；stdin EOF 视为「无补充」。另新增 spec 覆盖建议（result.specCoverage）：关键词启发式扫描 spec 已覆盖/缺失的 6 类测试点，纯建议、不进入契约、不影响判定。 v1.10.0 交互式追问升级为默认开 + 意见记忆 + JIT：TTY 终端每跑开头确认一次、CI/管道自动跳过；用户意见按项目跨 run 落盘（spec 同目录），给过的补充点静默自动注入、拒过的不再重复问；开头可一次拒（之后仅对 spec 真出现的新维度 JIT 追问一次），JIT 被拒则全局不再问；--no-question 硬关、--question 强制全问。
  platforms:
    - workbuddy
  permission: 本机自动化（启无头浏览器/截图/写报告，不修改被测软件）
  dependency: node >= 18 + playwright-core（browser 默认）；electron 需完整 playwright；小程序需 miniprogram-automator；原生需 webdriverio+Appium
  pricing: 免费
  icon: icon.png
  entry: verify.cjs
  trigger:
