    - AI监督
    - 防偷懒
    - 追问对账
  description: 像真人一样按说明书把软件功能全量验证一遍。解析说明书→用本机无头 Edge/Electron/小程序/Appium 真实点击填表→截图抓错断言→产出 ✅/❌ 报告。只验证不修复，带自进化知识库与贡献回流；v1.1 新增【自愈 Healer】（选择器失效自动找回等价元素）、【零依赖视觉回归】（DOM 布局指纹区分真缺陷与设计变更）、【MCP server】（别的 agent 也能直接调用验证能力）；v1.2 新增【verify_mcp · 验收其他 MCP】（作为 MCP client 连接目标 server，按 spec 核对工具清单并校验返回，补齐行为级契约验收）；v1.2.2 坑回流抽坑即脱敏+一键回传（--share）、预置 21 条公共 UI 验证坑语料，冷启动即有货；v1.2.3 坑匹配泛化（核心关键词+大小写不敏感+同义归一），同类报错不同措辞也命中；v1.2.4 坑库去重整理（64 条回流噪坑归并为 9 条干净可复用坑并补真实解法）；v1.2.5 抓坑即推断默认解法（新坑出生即带可用提示）；v1.2.6 坑库自维护（按 SYN_KEYS 信号词签名自动归并，库自洁净）；v1.3.0 行为闭环（学到 → 动作前拦截，不再是"只写不读"）——新增【复发哨兵】（同一指纹被反复 land 仍复发 → 判定候选无效并回写否决，loop 不再空转自欺）、【遮挡自愈】（点击/等待被 loading/模态遮罩拦截时三档自愈：清遮罩重试 → 原生 DOM click 兜底）、【网络与端口预检自愈】（导航前等待目标可达、端口被占自动改用空闲端口；证据驱动，只由本机学到的复发记忆触发，坑库仅作提示）、【跨宿主指纹归一】（剥离调用栈帧，同源错误在不同宿主收敛到同一指纹，共享知识库真正可跨宿主命中）。v1.4.0 去守门员化（G/P/I 双线贯通 + 读侧闭环）：agent-evolution 不再只当 E 类错误的守门员——新增期望落差(G)/计划偏离(P)/悬挂未完结(I) 三类信号接入进化账本并落盘，外部解法经 advisory 读回 verify.cjs 报告「进化提示」段，资料→经验→行为真正闭合成环，解除只写不读。v1.5.0 新增【不偷懒监督器】（追问-对账-门禁三阶段闭环）：按 6 类测试点类型（输入边界/状态转换/并发竞态/异常恢复/性能超时/安全注入）自动追问，逼出验证器「没想到要测」的用例并写入进化账本；验证结束前拿契约对照**真实执行日志**硬对账（口头声称「测过了」但无日志记录一律判漏检，跳过必须留理由）；有漏检则在报告顶部标注警告并拦截落盘。v1.5.1 起默认开启（此前需显式 enable:true，装了看不到效果等同没装）。
  platforms:
    - workbuddy
  permission: 本机自动化（启无头浏览器/截图/写报告，不修改被测软件）
  dependency: node >= 18 + playwright-core（browser 默认）；electron 需完整 playwright；小程序需 miniprogram-automator；原生需 webdriverio+Appium
  pricing: 免费
  icon: icon.png
  entry: verify.cjs
  trigger:
