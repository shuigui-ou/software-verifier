# SkillHub 发布清单（manifest）
# 字段对齐 skillhub.cn 上架规范；与 SKILL.md frontmatter 保持一致。
skill:
  name: software-verifier
  displayName: 软件功能全量验证器
version: 1.2.5
  author: user_12807b25
  category: 开发工具
  tags:
    - 软件测试
    - 功能走查
    - 回归验证
    - 自动化
    - 无头浏览器
    - 自进化
    - 自愈
    - 视觉回归
    - MCP
  description: 像真人一样按说明书把软件功能全量验证一遍。解析说明书→用本机无头 Edge/Electron/小程序/Appium 真实点击填表→截图抓错断言→产出 ✅/❌ 报告。只验证不修复，带自进化知识库与贡献回流；v1.1 新增【自愈 Healer】（选择器失效自动找回等价元素）、【零依赖视觉回归】（DOM 布局指纹区分真缺陷与设计变更）、【MCP server】（别的 agent 也能直接调用验证能力）；v1.2 新增【verify_mcp · 验收其他 MCP】（作为 MCP client 连接目标 server，按 spec 核对工具清单并校验返回，补齐行为级契约验收）；v1.2.2 坑回流抽坑即脱敏+一键回传（--share）、预置 21 条公共 UI 验证坑语料，冷启动即有货；v1.2.3 坑匹配泛化（核心关键词+大小写不敏感+同义归一），同类报错不同措辞也命中，回流坑越积越聪明；v1.2.4 坑库去重整理（64 条回流噪坑按失败模式归并为 9 条干净可复用坑并补真实解法，识别更准、库更轻）；v1.2.5 抓坑即推断默认解法（新坑出生即带可用提示，消除"待人工补充解法"废提示，外部用户不回传也有用）。
  platforms:
    - workbuddy
  permission: 本机自动化（启无头浏览器/截图/写报告，不修改被测软件）
  dependency: node >= 18 + playwright-core（browser 默认）；electron 需完整 playwright；小程序需 miniprogram-automator；原生需 webdriverio+Appium
  pricing: 免费
  icon: icon.png
  entry: verify.cjs
  trigger:
    - 按说明书验证软件
    - 把软件功能全量验证一遍
    - 功能走查
    - 回归测试
    - 上线前冒烟测试
    - 验收/检查其他 MCP server 的行为
  files:
    - SKILL.md
    - verify.cjs
    - engine.cjs
    - evolve.cjs
    - contribute.cjs
    - mcp-server.cjs
    - mcp-client.cjs
    - drivers/dom.js
    - drivers/heal.cjs
    - drivers/visual.cjs
    - drivers/miniprogram.js
    - drivers/appium.js
    - evolution/pitfalls.json
    - examples/block-workplan-spec.json
